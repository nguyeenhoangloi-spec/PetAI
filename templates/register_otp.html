<!doctype html>
<html class="{{ 'dark' if ui_theme == 'dark' else 'light' }}" lang="{{ ui_language or 'vi' }}" data-theme="{{ ui_theme or 'light' }}">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Xác thực OTP - PetAI</title>
    <script src="{{ url_for('static', filename='js/tailwindcss.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/typography.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-dark.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/toasts.css') }}" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              background: "#f8f9ff",
              "on-background": "#0b1c30",
              primary: "#004ac6",
              "primary-container": "#2563eb",
              "on-primary": "#ffffff",
              "surface-container-lowest": "#ffffff",
              "on-surface-variant": "#434655",
              "outline-variant": "#c3c6d7",
              error: "#ba1a1a",
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-background text-on-background font-sans min-h-screen flex flex-col justify-between">
    {% include '_toasts.html' %}
    
    <main class="flex-grow flex items-center justify-center p-6">
      <div class="max-w-[480px] w-full bg-surface-container-lowest rounded-2xl border border-slate-100 shadow-lg p-8 flex flex-col gap-6">
        <div class="text-center">
          <div class="flex items-center justify-center gap-2 mb-4">
            <span class="material-symbols-outlined text-primary text-3xl">mark_email_read</span>
            <span class="text-xl font-bold text-primary">PetAI</span>
          </div>
          <h2 class="text-2xl font-bold text-on-background mb-2">Xác thực Email</h2>
          <p class="text-sm text-on-surface-variant">
            Chúng tôi đã gửi mã xác thực OTP 6 số đến Gmail của bạn:<br>
            <strong class="text-primary">{{ email }}</strong>
          </p>
        </div>

        <form action="{{ url_for('register.verify_otp') }}" method="post" id="otpForm" class="flex flex-col gap-4">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          
          <div class="flex flex-col gap-2">
            <label class="block text-sm font-medium text-on-background" for="otp">Mã xác thực OTP</label>
            <input
              class="w-full h-12 text-center text-2xl font-semibold tracking-[8px] rounded-xl border border-outline-variant bg-slate-50 focus:bg-white text-on-background focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all"
              id="otp"
              name="otp"
              placeholder="000000"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="6"
              required
              autocomplete="one-time-code"
              autofocus
            />
            <small class="text-error text-xs" id="otpError"></small>
          </div>

          <div class="text-center text-sm text-on-surface-variant flex items-center justify-center gap-1">
            <span class="material-symbols-outlined text-sm">schedule</span>
            Mã OTP sẽ hết hạn sau: <span id="countdown" class="font-bold text-primary">05:00</span>
          </div>

          <button
            class="w-full h-12 bg-primary text-on-primary font-semibold rounded-xl hover:bg-primary-container transition-all active:scale-[0.98] shadow-sm flex justify-center items-center"
            type="submit"
          >
            Xác nhận tài khoản
          </button>
        </form>

        <div class="relative flex items-center py-2">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink-0 mx-4 text-xs text-slate-400">hoặc</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <div class="flex justify-between items-center text-sm">
          <a href="{{ url_for('register.register') }}" class="text-slate-500 hover:text-primary transition-colors flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Đăng ký lại
          </a>
          
          <form action="{{ url_for('register.resend_otp') }}" method="post" id="resendForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <button type="submit" id="resendBtn" class="text-primary hover:underline font-medium disabled:opacity-50 disabled:no-underline disabled:cursor-not-allowed">
              Gửi lại mã OTP
            </button>
          </form>
        </div>
      </div>
    </main>

    <footer class="py-4 border-t border-slate-100 text-center text-xs text-slate-400">
      Bản quyền © 2026 PetAI. Mọi quyền được bảo lưu.
    </footer>

    <script src="{{ url_for('static', filename='js/toasts.js') }}"></script>
    <script>
      // Đếm ngược 5 phút (300 giây)
      let timeLeft = 300;
      const countdownEl = document.getElementById("countdown");
      const resendBtn = document.getElementById("resendBtn");
      
      const timer = setInterval(() => {
        timeLeft--;
        const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const seconds = (timeLeft % 60).toString().padStart(2, '0');
        countdownEl.textContent = `${minutes}:${seconds}`;

        if (timeLeft <= 0) {
          clearInterval(timer);
          countdownEl.textContent = "Đã hết hạn";
          countdownEl.classList.add("text-error");
        }
      }, 1000);

      // Validation trước khi submit
      document.getElementById("otpForm").addEventListener("submit", function(e) {
        const otpInput = document.getElementById("otp");
        const otpError = document.getElementById("otpError");
        otpError.textContent = "";

        if (!/^[0-9]{6}$/.test(otpInput.value)) {
          otpError.textContent = "Vui lòng nhập mã OTP gồm đúng 6 chữ số.";
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
