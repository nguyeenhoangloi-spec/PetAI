<!-- html-validate-disable no-dup-class, void-style, attribute-allowed-values -->
<!DOCTYPE html>
<html class="{{ 'dark' if ui_theme == 'dark' else 'light' }}" lang="{{ ui_language or 'vi' }}"
  data-theme="{{ ui_theme or 'light' }}">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title data-i18n="otpVerifyPageTitle">Xác thực OTP - {{ get_config('site_name', 'PetAI') }}</title>
  <script src="{{ url_for('static', filename='js/tailwindcss.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/typography.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme-dark.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/toasts.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: "#f8f9ff",
            "on-background": "#0b1c30",
            primary: "#bc4800", // Tông màu đất ấm áp phù hợp với trang quên mật khẩu của PetAI
            "primary-container": "#bc4800",
            "on-primary": "#ffffff",
            "surface-container-lowest": "#ffffff",
            "on-surface-variant": "#434655",
            "outline-variant": "#c3c6d7",
            error: "#ba1a1a",
          }
        }
      }
    };
  </script>
    <style>
      .otp-input {
        width: 48px;
        height: 56px;
        font-size: 24px;
        font-weight: 700;
        text-align: center;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        background-color: #f8fafc;
      }
      .otp-input:focus {
        border-color: #bc4800;
        box-shadow: 0 0 0 3px rgba(188, 72, 0, 0.15);
      }
      .dark .otp-input {
        border-color: #334155;
        background-color: #0f172a;
        color: #f8fafc;
      }
      .dark .otp-input:focus {
        border-color: #f97316;
        box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.25);
      }
    </style>
  </head>

<body class="bg-background text-on-background font-sans min-h-screen flex flex-col justify-between">
  {% include '_toasts.html' %}

  <main class="flex-grow flex items-center justify-center p-6">
    <div
      class="max-w-[480px] w-full bg-surface-container-lowest rounded-2xl border border-slate-100 shadow-lg p-8 flex flex-col gap-6">
      <div class="text-center">
        <div class="flex items-center justify-center gap-2 mb-4">
          <span class="material-symbols-outlined text-primary text-3xl">lock_reset</span>
          <span class="text-xl font-bold text-primary">{{ get_config('site_name', 'PetAI') }}</span>
        </div>
        <h2 class="text-2xl font-bold text-on-background mb-2" data-i18n="forgotPasswordHeader">Khôi phục mật khẩu</h2>
        <p class="text-sm text-on-surface-variant" data-i18n="forgotOtpDesc">
          Nếu thông tin bạn nhập là chính xác, mã OTP 6 số đã được gửi đến email khôi phục của tài khoản.
        </p>
      </div>

      <form action="{{ url_for('account.verify_otp_forgot') }}" method="post" id="otpForm" class="flex flex-col gap-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="flex flex-col gap-2">
          <label class="block text-sm font-medium text-on-background text-center mb-1" for="otp-box-1" data-i18n="otpCodeLabel">Mã xác thực OTP</label>
          <div class="flex justify-center gap-2 mb-2" id="otp-boxes">
            <input id="otp-box-1" class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
            <input class="otp-input" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
          </div>
          <input type="hidden" name="otp" id="otp">
          <small class="text-error text-xs text-center" id="otpError"></small>
        </div>

        <div class="text-center text-sm text-on-surface-variant flex items-center justify-center gap-1">
          <span class="material-symbols-outlined text-sm">schedule</span>
          <span data-i18n="otpExpiryLabel">Mã OTP sẽ hết hạn sau:</span> <span id="countdown" class="font-bold text-primary">10:00</span>
        </div>

        <button
          class="w-full h-12 bg-primary text-on-primary font-semibold rounded-xl hover:opacity-90 transition-all active:scale-[0.98] shadow-sm flex justify-center items-center"
          type="submit" data-i18n="confirmOtpBtn">
          Xác nhận OTP
        </button>
      </form>

      <div class="relative flex items-center py-2">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink-0 mx-4 text-xs text-slate-400" data-i18n="orLabel">hoặc</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <div class="flex justify-between items-center text-sm">
        <a href="{{ url_for('account.forgot') }}"
          class="text-slate-500 hover:text-primary transition-colors flex items-center gap-1">
          <span class="material-symbols-outlined text-sm">arrow_back</span> <span data-i18n="reenterEmailLink">Nhập lại email</span>
        </a>

        <form action="{{ url_for('account.resend_otp_forgot') }}" method="post" id="resendForm">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <button type="submit" id="resendBtn" data-i18n="resendOtpLink"
            class="text-primary hover:underline font-medium disabled:opacity-50 disabled:no-underline disabled:cursor-not-allowed">
            Gửi lại mã OTP
          </button>
        </form>
      </div>
    </div>
  </main>

<script src="{{ url_for('static', filename='js/toasts.js') }}"></script>
  <script src="{{ url_for('static', filename='js/i18n.js') }}?v=23"></script>
  <script>
    // Đếm ngược 10 phút (600 giây)
    let timeLeft = 600;
    const countdownEl = document.getElementById("countdown");

    const timer = setInterval(() => {
      timeLeft--;
      const minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
      const seconds = (timeLeft % 60).toString().padStart(2, '0');
      countdownEl.textContent = `${minutes}:${seconds}`;

      if (timeLeft <= 0) {
        clearInterval(timer);
        countdownEl.textContent = (window.PetAI_i18n && window.PetAI_i18n.t("planExpired")) || "Đã hết hạn";
        countdownEl.classList.add("text-error");
      }
    }, 1000);

    // OTP input auto-advance
    const inputs = document.querySelectorAll('#otp-boxes .otp-input');
    inputs.forEach((inp, idx) => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/[^0-9]/g, '').slice(-1);
        if (inp.value && idx < inputs.length - 1) inputs[idx + 1].focus();
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !inp.value && idx > 0) inputs[idx - 1].focus();
      });
      inp.addEventListener('paste', (e) => {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
        inputs.forEach((box, i) => { box.value = paste[i] || ''; });
        inputs[Math.min(paste.length, inputs.length - 1)].focus();
      });
    });

    // Focus first box automatically
    inputs[0]?.focus();

    // Combine values on submit and validate
    document.getElementById("otpForm").addEventListener("submit", function (e) {
      const otpInput = document.getElementById("otp");
      const otpError = document.getElementById("otpError");
      otpError.textContent = "";

      const otpVal = Array.from(inputs).map(i => i.value).join('');
      otpInput.value = otpVal;

      if (!/^[0-9]{6}$/.test(otpVal)) {
        otpError.textContent = (window.PetAI_i18n && window.PetAI_i18n.t("otpInvalidError")) || "Vui lòng nhập mã OTP gồm đúng 6 chữ số.";
        e.preventDefault();
      }
    });
  </script>
</body>

</html>
