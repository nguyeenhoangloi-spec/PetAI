<!-- Floating QR Action Button -->
<div class="fixed bottom-6 right-6 z-[9999]">
  <button id="floatingQrBtn" type="button" 
          class="flex items-center justify-center w-14 h-14 rounded-full bg-blue-600 hover:bg-blue-700 text-white shadow-lg hover:shadow-xl active:scale-95 transition-all duration-300 focus:outline-none"
          title="Quét QR truy cập" data-i18n-title="qrModalButtonTooltip">
    <span class="material-symbols-outlined text-[28px]">qr_code_2</span>
  </button>
</div>

<!-- QR Modal Backdrop & Container -->
<div id="qrAccessModal" class="fixed inset-0 z-[10000] hidden items-center justify-center bg-black/60 backdrop-blur-sm opacity-0 transition-opacity duration-300">
  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-[90%] max-w-md md:max-w-2xl rounded-2xl p-6 shadow-2xl transform scale-95 opacity-0 transition-all duration-300" id="qrAccessModalContent">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
      <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
        <span class="material-symbols-outlined text-blue-600">qr_code_2</span>
        <span data-i18n="qrModalTitle">Mã QR Truy Cập</span>
      </h3>
      <button id="closeQrModalBtn" type="button" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="flex flex-col items-center py-6 text-center">
      <div class="p-4 bg-white rounded-2xl shadow-inner border border-slate-100 mb-4">
        <img src="{{ url_for('static', filename='ngrok_qr.png') }}" alt="Ngrok Access QR Code" class="w-64 h-64 md:w-[480px] md:h-[480px] object-contain">
      </div>
      <p class="text-sm font-medium text-slate-600 dark:text-slate-300 px-2" data-i18n="qrModalHelp">
        Quét mã QR bằng thiết bị di động của bạn để truy cập ứng dụng nhanh chóng.
      </p>
      <span class="text-xs text-blue-650 dark:text-blue-450 mt-2 font-mono break-all select-all">
        https://nonsuspensively-monacidic-raylan.ngrok-free.dev
      </span>
    </div>

    <!-- Modal Footer -->
    <div class="flex justify-end pt-4 border-t border-slate-100 dark:border-slate-800">
      <button id="closeQrModalBtn2" type="button" 
              class="px-5 py-2 rounded-xl text-sm font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition-all duration-200"
              data-i18n="close">
        Đóng
      </button>
    </div>
  </div>
</div>

<script>
  (function() {
    const btn = document.getElementById('floatingQrBtn');
    const modal = document.getElementById('qrAccessModal');
    const content = document.getElementById('qrAccessModalContent');
    const closeBtn = document.getElementById('closeQrModalBtn');
    const closeBtn2 = document.getElementById('closeQrModalBtn2');

    if (!btn || !modal || !content) return;

    function openModal() {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      // Force repaint to trigger animation
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modal.classList.add('opacity-100');
        content.classList.remove('scale-95', 'opacity-0');
        content.classList.add('scale-100', 'opacity-100');
      }, 10);
    }

    function closeModal() {
      modal.classList.remove('opacity-100');
      modal.classList.add('opacity-0');
      content.classList.remove('scale-100', 'opacity-100');
      content.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.remove('flex');
        modal.classList.add('hidden');
      }, 300);
    }

    btn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    if (closeBtn2) closeBtn2.addEventListener('click', closeModal);

    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        closeModal();
      }
    });
  })();
</script>
