name: Build iOS IPA

on:
  workflow_dispatch: {}

jobs:
  build-ipa:
    name: Build iOS .ipa (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Flutter pub get
        run: |
          cd app_web_view
          flutter pub get
          cd ios || true
          pod install --repo-update || true

      - name: Decode and import iOS signing certificate
        if: secrets.IOS_CERT_BASE64 != '' && secrets.IOS_CERT_PASSWORD != ''
        env:
          CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          CERT_PWD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_BASE64" | base64 --decode > ios_certificate.p12
          security create-keychain -p "" build.keychain
          security import ios_certificate.p12 -k ~/Library/Keychains/build.keychain -P "$CERT_PWD" -T /usr/bin/codesign
          security list-keychains -s ~/Library/Keychains/build.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "" ~/Library/Keychains/build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" ~/Library/Keychains/build.keychain

      - name: Install provisioning profile
        if: secrets.IOS_PROVISIONING_PROFILE_BASE64 != ''
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Create export options plist
        run: |
          cat > export_options.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        env:
          FLUTTER_VERSION: stable
        run: |
          cd app_web_view
          flutter build ipa --export-options-plist=../export_options.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-ipa
          path: |
            app_web_view/build/ios/ipa/**/*.ipa
